[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-detective"
version = "0.1.0"
description = "Offline pcap/pcapng summarizer with a PySide6 GUI and a CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["scapy>=2.5", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pcap-detective = "pcap_detective.cli:main"

[project.gui-scripts]
pcap-detective-gui = "pcap_detective.ui.app:main"

[tool.setuptools.packages.find]
include = ["pcap_detective*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
